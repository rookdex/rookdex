name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
  # launch-rebuild (dashboard spec §12): 23:05 UTC on 18 Nov is 00:05 CET on 19 Nov. The hub's
  # server HTML is built with the build time, so this rebuild is what makes it the dashboard.
  schedule:
    - cron: "5 23 18 11 *"

permissions:
  contents: read

# One production deploy at a time, in push order. A running deploy is never cancelled halfway;
# a newer push replaces any run still waiting, so main's latest commit is what ends up live.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Scheduled runs go ahead only in 2026, so the launch rebuild doesn't fire again next year.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.year.outputs.go }}
    steps:
      - id: year
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$(date -u +%Y)" = "2026" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test

  deploy:
    needs: [gate, test]
    # workflow_dispatch can target any branch; only main may reach production (SEO spec §4.6).
    # On the launch schedule a failed test is reported but doesn't stop the rebuild: the same
    # commit already passed on its push (dashboard spec §12).
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.gate.outputs.go == 'true' && (needs.test.result == 'success' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Ping IndexNow
        # Search engines learn about changed pages sooner. A failed ping shows as a failed step,
        # never a failed deploy; the key file is public by design and no secret is used.
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          mapfile -t urls < <(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##')
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "## IndexNow: no URLs in dist/sitemap.xml" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -n --rawfile key public/indexnow-key.txt \
            '{host: "rookdex.app", key: $key, keyLocation: "https://rookdex.app/indexnow-key.txt", urlList: $ARGS.positional}' \
            --args "${urls[@]}" > body.json
          status=$(curl -sS --max-time 20 -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json) || true
          {
            echo "## IndexNow"
            echo "HTTP ${status:-none} for ${#urls[@]} URLs"
            cat resp.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 200 ] || [ "$status" = 202 ] || exit 1
