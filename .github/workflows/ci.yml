name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    # Secrets are not exposed to forks or Dependabot; skip the upload there.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
      - name: Preview URL
        env:
          OUT: ${{ steps.preview.outputs.command-output }}
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "## Preview" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$URL" ]; then
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$OUT" | grep -i "preview" >> "$GITHUB_STEP_SUMMARY" || echo "no preview URL in output" >> "$GITHUB_STEP_SUMMARY"
          fi
